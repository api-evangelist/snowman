name: Snowman
description: 'Snowman Logistics is an Indian integrated cold-chain and temperature-controlled
  logistics company headquartered in Bengaluru, providing refrigerated (frozen and
  chilled) warehousing, cold storage, and distribution services across India. It serves
  frozen and chilled foods, dairy, seafood, quick-service restaurants, pharmaceuticals,
  and other perishables through a national network of temperature-controlled warehouses
  and a refrigerated transportation fleet. The company is publicly listed on Indian
  exchanges and was surfaced as a portfolio company of Norwest Venture Partners. This
  profile was enriched by the API Evangelist pipeline; the enrichment pass confirmed
  the company publishes a marketing/corporate website (snowman.in) but exposes no public
  developer, API, or well-known discovery surface.'
